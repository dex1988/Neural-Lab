services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/neural_lab.db
      WEB_AI_VECTOR_DIR: /data/web_ai_vectors
      HF_TOKEN: ${HF_TOKEN:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      HF_MODEL: ${HF_MODEL:-}
      WEB_AI_LLM_MODEL: ${WEB_AI_LLM_MODEL:-}
    volumes:
      - neural_lab_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  neural_lab_data:
